<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kalayaan Callings · v1</title>
  <meta name="description" content="A Trello-style board for tracking ward callings through their pipeline." />
  <link rel="stylesheet" href="styles.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📋</text></svg>" />
</head>
<body>
  <header class="topbar">
    <span id="board-title" class="board-title" title="Rename board">Kalayaan Callings</span>
    <div class="spacer"></div>
    <div id="top-members" class="members"></div>
    <button id="reset-btn" class="pill" title="Reset to sample data">Reset</button>
    <button id="version-btn" class="pill version-badge" title="Switch version">
      v1 <span class="caret">▼</span>
    </button>
  </header>

  <main id="board" class="board" aria-label="Callings board"></main>

  <!-- Version dropdown -->
  <div id="version-menu" class="menu" hidden></div>

  <!-- Card detail modal -->
  <div id="overlay" class="overlay" hidden>
    <div id="modal" class="modal" role="dialog" aria-modal="true"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
