<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kalayaan Callings</title>
  <meta name="description" content="A shared, realtime board for tracking ward callings through their pipeline." />
  <link rel="stylesheet" href="styles.css?v=29" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📋</text></svg>" />
</head>
<body>
  <header class="topbar">
    <span id="board-title" class="board-title" title="Rename board">Kalayaan Callings</span>
    <div class="spacer"></div>
    <span id="sync-status" class="sync-status" title="Sync status">● Connecting…</span>
    <div id="top-members" class="members"></div>
    <button id="share-btn" class="pill" title="Copy shared board link" hidden>Share</button>
    <button id="reset-btn" class="pill" title="Reset to sample data">Reset</button>
    <span id="version-badge" class="version-tag" title="Version">v8</span>
  </header>

  <main id="board" class="board" aria-label="Callings board"></main>

  <!-- Card detail modal -->
  <div id="overlay" class="overlay" hidden>
    <div id="modal" class="modal" role="dialog" aria-modal="true"></div>
  </div>

  <script type="module" src="app.js?v=29"></script>
</body>
</html>
