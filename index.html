<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kalayaan Callings</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📋</text></svg>" />
  <style>
    html, body { height: 100%; margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; }
    body {
      display: flex; align-items: center; justify-content: center;
      background: linear-gradient(160deg, #7ec8e3, #a8d8ea 40%, #c9e4d4 80%);
      color: #172b4d;
    }
    .card {
      background: rgba(255,255,255,0.92); border-radius: 14px; padding: 28px 32px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.2); text-align: center; max-width: 380px;
    }
    h1 { font-size: 20px; margin: 0 0 6px; }
    p { color: #5e6c84; font-size: 14px; margin: 0 0 18px; }
    .versions { display: flex; flex-direction: column; gap: 8px; }
    a.v {
      display: flex; justify-content: space-between; align-items: center;
      text-decoration: none; color: #172b4d; background: #f1f2f4;
      padding: 10px 14px; border-radius: 8px; font-size: 14px;
    }
    a.v:hover { background: #e2e4e9; }
    a.v .tag { font-size: 12px; color: #0c66e4; font-weight: 700; }
    .spin { color: #5e6c84; font-size: 13px; }
  </style>
  <!-- Instant redirect to the latest version. The list below is the fallback
       (and a manual picker) if JS is disabled or you want to pick an older one. -->
  <script>
    (async function () {
      try {
        const res = await fetch('versions.json', { cache: 'no-store' });
        const data = await res.json();
        var latest = data.latest || (data.versions && data.versions[0] && data.versions[0].id) || 'v1';
        location.replace(latest + '/');
      } catch (e) {
        location.replace('v1/');
      }
    })();
  </script>
</head>
<body>
  <div class="card">
    <h1>Kalayaan Callings</h1>
    <p class="spin">Opening the latest version…</p>
    <div class="versions">
      <noscript><a class="v" href="v1/">Version 1 <span class="tag">open</span></a></noscript>
    </div>
  </div>
</body>
</html>
